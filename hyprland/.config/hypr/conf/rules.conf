# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# WORKSPACES
workspace = 1, defaultName:obsidian, monitor:DP-2, persistent:true
workspace = 2, defaultName:web, monitor:DP-2, persistent:true
workspace = 3, defaultName:vim, monitor:DP-2, persistent:true
workspace = 4, defaultName:discord, monitor:DP-2, persistent:false
workspace = 9, defaultName:dev, monitor:eDP-1, persistent:true

# WINDOWS
windowrule = match:class 1Password, float on
windowrule = match:class Weave, tag dev 
windowrule = match:class discord, tag discord, workspace name:discord 
windowrule = match:tag dev, workspace name:dev
# windowrule = match:tag discord, workspace name:discord
windowrule = match:tag dev, no_initial_focus on

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class (.*), suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
